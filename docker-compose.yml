services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: modelnest
      POSTGRES_USER: modelnest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelnest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODELNEST_ENV: ${MODELNEST_ENV:-production}
      MODELNEST_DATABASE_URL: postgresql+psycopg://modelnest:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/modelnest
      MODELNEST_SECRET_KEY: ${MODELNEST_SECRET_KEY:?set MODELNEST_SECRET_KEY in .env}
      MODELNEST_BOOTSTRAP_TOKEN: ${MODELNEST_BOOTSTRAP_TOKEN:?set MODELNEST_BOOTSTRAP_TOKEN in .env}
      MODELNEST_STORAGE_DIR: /data/artifacts
    volumes:
      - artifact-data:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  artifact-data:
